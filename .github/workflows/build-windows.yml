# Builds Questline for Windows on GitHub's servers.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# Download the result from the run's "Artifacts" section.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS tooling
        run: npm ci

      - name: Build installer and portable exe
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: Questline-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/questline.exe
          if-no-files-found: error
