# Builds Questline for Windows and publishes it as a GitHub Release.
# The installed app checks the latest release and offers the update.
#
# Runs when you push changes to the app (src/, src-tauri/, package files) to main,
# or manually from the Actions tab. Versions are SERIES.<n>: the first release in
# a series is .0, then .1, .2… To start a new series (e.g. 0.4), change SERIES below.
# Add [skip ci] to a commit message to push without releasing.
name: Build and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

env:
  SERIES: '0.3'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check signing setup
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY. See README → Updates."
            exit 1
          fi
          if grep -q PASTE_YOUR_PUBLIC_KEY_HERE src-tauri/tauri.conf.json; then
            echo "::error::Paste your public key into src-tauri/tauri.conf.json (plugins.updater.pubkey)."
            exit 1
          fi

      - name: Pick the next version in the series
        shell: bash
        run: |
          # Count releases already tagged vSERIES.* (e.g. v0.3.0, v0.3.1) and use the next number.
          n=$(git ls-remote --tags origin "refs/tags/v${SERIES}.*" | grep -v '\^{}' | wc -l | tr -d ' ')
          VERSION="${SERIES}.${n}"
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          " "$VERSION"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS tooling
        run: npm ci

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Questline v__VERSION__
          releaseBody: ${{ github.event.head_commit.message || 'Manual release' }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
