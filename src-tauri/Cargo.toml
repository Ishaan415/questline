[package]
name = "questline"
version = "0.1.0"
description = "A cozy pixel-RPG planner: dailies, reminders, calendar sync and focus mode."
authors = ["Ishaan"]
edition = "2021"

[lib]
name = "questline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Phone bridge (Google sign-in, haptics, back button, APK updates). Does nothing on Windows.
tauri-plugin-ql-mobile = { path = "plugins/ql-mobile" }
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "fs"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

# Desktop-only: tray, autostart, hotkeys, one window, signed installer updates.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Small, fast binary: this app lives in the tray all day.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
