"$schema" = "schemas/schema.json"

[default]
description = "Lets the page trigger haptics, colour the Android system bars, turn the screen and use the whole screen in focus mode, and feed the home-screen widget."
permissions = ["allow-haptic", "allow-set-bars", "allow-set-orientation", "allow-set-immersive", "allow-widget-update", "allow-widget-take"]
